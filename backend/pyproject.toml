[project]
name = "unifix-backend"
version = "0.1.0"
description = "UniFix backend: university service marketplace API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.160,<1.0",
    "uvicorn[standard]>=0.50,<1.0",
    "sqlalchemy[asyncio]>=2.0.40,<2.2",
    "alembic>=1.16,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "email-validator>=2.2,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "pyjwt>=2.10,<3.0",
    "pillow>=11,<13",
    "python-multipart>=0.0.20,<0.1",
    "boto3>=1.38,<2",
    "rfc8785>=0.1.4,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.0,<2",
    "httpx>=0.28,<0.29",
    "ruff>=0.12,<1.0",
    "mypy>=1.17,<2.0",
    "import-linter>=2.3,<3",
    "boto3-stubs[s3]>=1.38,<2",
]

[tool.uv]
package = false
# Supply-chain hygiene: only resolve releases that have been public for at least two weeks.
exclude-newer = "2026-11-03T00:00:00Z"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "N", "T20"]
ignore = [
    "S101",  # asserts are used for internal invariants
    "N818",  # HTTP-semantic exception names (NotFound, Conflict) read better than *Error
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/cli.py" = ["T201"]
"scripts/**" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Cookie", "fastapi.Body", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "concurrency: tests that use several real database connections at once",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core does not depend on api or modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.api", "app.modules"]

[[tool.importlinter.contracts]]
name = "routers do not touch repositories directly"
type = "forbidden"
source_modules = ["app.modules.*.router"]
forbidden_modules = ["app.modules.*.repository"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "repositories do not import services or routers"
type = "forbidden"
source_modules = ["app.modules.*.repository"]
forbidden_modules = ["app.modules.*.service", "app.modules.*.router", "app.api"]
allow_indirect_imports = true
